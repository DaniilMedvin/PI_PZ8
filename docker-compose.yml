name: pi_pz8

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pi_pz8
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pi_pz8"]
      interval: 3s
      retries: 20

  web:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
